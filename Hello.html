<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
    <h1>Hello, World!</h1>
    <p>Welcome to my first HTML page.</p>

    <input type="text">
    <button>Submit</button>

    <form action="/www.goggle.com">
        <input type="text">
        <button>Form Filled</button>
    </form>
    <script src="Hello.js"></script>
</body>

</html>
